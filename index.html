<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torn Revive Watch</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background-color: #0d0f14;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.8rem 1.5rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .header {
      border-bottom: 1px solid #2a2f3a;
      padding-bottom: 1.2rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
    }

    .header h1 {
      font-weight: 500;
      font-size: 2.1rem;
      letter-spacing: 0.5px;
      background: linear-gradient(145deg, #d4e0ff, #a0b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .header h1 i {
      -webkit-text-fill-color: #7b93e0;
      background: none;
      font-size: 2rem;
    }

    .header-sub {
      margin-left: auto;
      color: #8e98b3;
      font-size: 0.9rem;
      background: #1a1e26;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      border: 1px solid #2f3645;
    }

    .card {
      background: #151b23;
      border-radius: 24px;
      padding: 1.8rem 2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid #282f3b;
      margin-bottom: 2.5rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1.2rem 1.8rem;
    }

    .input-field {
      flex: 1 0 160px;
      min-width: 140px;
    }

    .input-field label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #99a4c2;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }

    .input-field input {
      width: 100%;
      background: #0f131a;
      border: 1px solid #2c3442;
      border-radius: 16px;
      padding: 0.8rem 1.2rem;
      color: #f0f4ff;
      font-size: 1rem;
      transition: 0.2s;
      outline: none;
    }

    .input-field input:focus {
      border-color: #5f7cdf;
      box-shadow: 0 0 0 3px rgba(79, 114, 226, 0.25);
      background: #11171f;
    }

    .input-field input::placeholder {
      color: #4b5368;
      font-weight: 300;
      font-size: 0.9rem;
    }

    .btn {
      background: #2f3d6b;
      border: none;
      border-radius: 40px;
      padding: 0.8rem 2.4rem;
      font-weight: 600;
      font-size: 1rem;
      color: #f0f6ff;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(0, 20, 60, 0.5);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(145deg, #30447a, #1f2b4f);
      border: 1px solid #4e66a3;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .btn:hover {
      transform: scale(1.02);
      background: #3b5090;
      border-color: #7489dd;
      box-shadow: 0 6px 16px rgba(60, 100, 220, 0.3);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn i {
      font-size: 1rem;
    }

    .status-bar {
      margin: 1rem 0 0.5rem;
      min-height: 2.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      color: #b9c4e0;
    }

    .status-message {
      background: #1b222c;
      padding: 0.3rem 1.2rem;
      border-radius: 30px;
      font-size: 0.9rem;
      border-left: 3px solid #4b6bc0;
    }

    .spinner {
      display: none;
      color: #8aa2e6;
    }

    .spinner i {
      font-size: 1.3rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-container {
      margin-top: 1.2rem;
      background: #10161e;
      border-radius: 20px;
      padding: 1.5rem 0.2rem 0.2rem 0.2rem;
      border: 1px solid #29303d;
      overflow-x: auto;
    }

    .member-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .member-table th {
      text-align: left;
      padding: 0.6rem 1rem 0.8rem 1.5rem;
      color: #9aabcf;
      font-weight: 500;
      letter-spacing: 0.4px;
      border-bottom: 1px solid #28303f;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .member-table td {
      padding: 0.7rem 1rem 0.7rem 1.5rem;
      border-bottom: 1px solid #202734;
      color: #e0e8fa;
    }

    .member-table tr:last-child td {
      border-bottom: none;
    }

    .member-table tr:hover td {
      background: #1b222d;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: #2a3345;
      color: #b0bedd;
    }

    .badge.revivable {
      background: #1b4d3b;
      color: #86dfb2;
      border: 1px solid #3b8a69;
      box-shadow: 0 0 6px rgba(70, 200, 140, 0.2);
    }

    .badge.not-revivable {
      background: #3d2a32;
      color: #e9a0b0;
      border: 1px solid #794a5a;
    }

    .empty-row td {
      padding: 2.5rem 1rem;
      text-align: center;
      color: #616c88;
      font-style: italic;
    }

    .footer {
      margin-top: 2.8rem;
      border-top: 1px solid #232a35;
      padding: 1.8rem 0 0.8rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      color: #6b7897;
      font-size: 0.9rem;
    }

    .footer a {
      color: #8596c0;
      text-decoration: none;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #2d3546;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      background: #11181f;
    }

    .footer a:hover {
      color: #b7ccff;
      border-color: #4d66a5;
      background: #1b2330;
    }

    .footer a i {
      font-size: 1.2rem;
    }

    .footer .copy {
      color: #525f7a;
      font-size: 0.8rem;
      align-self: center;
    }

    .footer .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.5rem;
      margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px solid #232b38;
    }

    .search-row .input-field {
      flex: 2 0 200px;
    }

    .search-row .btn {
      padding: 0.6rem 1.8rem;
      background: #253153;
      border-color: #3f5283;
    }

    .search-row .btn i {
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .app-wrapper {
        padding: 1rem 0.8rem;
      }
      .header h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 1.2rem 1rem;
      }
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        justify-content: center;
        padding: 0.8rem 1.2rem;
      }
      .member-table th,
      .member-table td {
        padding: 0.5rem 0.6rem;
        font-size: 0.8rem;
      }
      .badge {
        padding: 0.15rem 0.8rem;
        font-size: 0.65rem;
      }
      .footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .footer .links {
        justify-content: center;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #12181f;
    }
    ::-webkit-scrollbar-thumb {
      background: #38415a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="app-wrapper">

  <!-- HEADER -->
  <header class="header">
    <h1>
      <i class="fas fa-heartbeat"></i> C0pyc4t Revive Watch
    </h1>
    <span class="header-sub"><i class="fas fa-shield-alt"></i> Torn · v2</span>
  </header>

  <!-- INPUT CARD -->
  <div class="card">
    <div class="input-group">
      <div class="input-field">
        <label for="apiKeyInput"><i class="fas fa-key"></i> API Key</label>
        <input type="text" id="apiKeyInput" placeholder="Your Torn API key" value="000000">
      </div>
      <div class="input-field">
        <label for="factionIdInput"><i class="fas fa-users"></i> Faction ID</label>
        <input type="text" id="factionIdInput" placeholder="Faction ID (optional)" value="">
      </div>
      <button class="btn" id="fetchBtn"><i class="fas fa-sync-alt"></i> Check Revive</button>
    </div>

    <!-- search by user (independent) -->
    <div class="search-row">
      <div class="input-field">
        <label for="userSearchInput"><i class="fas fa-user-search"></i> Or search by User ID</label>
        <input type="text" id="userSearchInput" placeholder="e.g. 123456">
      </div>
      <button class="btn" id="searchUserBtn"><i class="fas fa-user"></i> Lookup User</button>
      <button class="btn" id="clearSearchBtn" style="background:#2d3345; border-color:#4a526b;"><i class="fas fa-times"></i> Clear</button>
    </div>

    <!-- status -->
    <div class="status-bar">
      <span class="status-message" id="statusMsg"><i class="fas fa-info-circle"></i> Enter API key, then faction or user ID</span>
      <span class="spinner" id="spinner"><i class="fas fa-circle-notch"></i> loading</span>
    </div>

    <!-- RESULT TABLE -->
    <div class="result-container" id="resultContainer">
      <table class="member-table" id="memberTable">
        <thead>
          <tr>
            <th>Member</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row">
            <td colspan="2"><i class="fas fa-user-slash"></i> No data yet — use the form above</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="links">
      <a href="#" target="_blank" id="githubLink">
        <i class="fab fa-github"></i> <span>Repository</span>
      </a>
      <a href="https://www.torn.com/profiles.php?XID=4039125" target="_blank" id="tornProfileLink">
        <i class="fas fa-user-circle"></i> <span>c0pyc4t</span>
      </a>
    </div>
    <span class="copy"><i class="far fa-copyright"></i> c0pyc4t 56333 Revive · Torn city</span>
    <span style="opacity:0.5; font-size:0.8rem;">⚡ static · github pages</span>
  </footer>
</div>

<script>
  (function() {
    // DOM elements
    const apiInput = document.getElementById('apiKeyInput');
    const factionInput = document.getElementById('factionIdInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const userSearchInput = document.getElementById('userSearchInput');
    const searchUserBtn = document.getElementById('searchUserBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const statusMsg = document.getElementById('statusMsg');
    const spinner = document.getElementById('spinner');
    const tableBody = document.getElementById('tableBody');
    const githubLink = document.getElementById('githubLink');

    githubLink.href = 'https://github.com/copycat1337/tornn_revive_watch';

    // helpers
    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function setStatus(msg, isError = false, isLoading = false) {
      statusMsg.innerHTML = msg;
      statusMsg.style.borderLeftColor = isError ? '#c75b6b' : '#4b6bc0';
      spinner.style.display = isLoading ? 'inline-flex' : 'none';
    }

    function renderMembers(members) {
      if (!members || members.length === 0) {
        tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-users-slash"></i> No members found</td></tr>`;
        return;
      }

      let html = '';
      for (const m of members) {
        const name = m.name || 'Unnamed';
        const isRevivable = m.is_revivable === true;
        const statusClass = isRevivable ? 'revivable' : 'not-revivable';
        const statusText = isRevivable ? 'REVIVABLE' : 'NOT REVIVABLE';
        const idDisplay = m.id ? `#${m.id}` : '';
        html += `<tr>
          <td><i class="fas fa-user" style="color:#5f78b0; margin-right:10px;"></i>${escapeHtml(name)} <span style="color:#6a7a9a; font-size:0.75rem; margin-left:6px;">${escapeHtml(idDisplay)}</span></td>
          <td><span class="badge ${statusClass}">${statusText}</span></td>
        </tr>`;
      }
      tableBody.innerHTML = html;
    }

    // ----- fetch faction members -----
    async function fetchFaction(apiKey, factionId) {
      if (!apiKey.trim()) { setStatus('❌ API key required.', true); return null; }
      if (!factionId.trim()) { setStatus('❌ Faction ID required.', true); return null; }

      setStatus('⏳ Fetching faction members...', false, true);
      tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-spinner fa-pulse"></i> loading...</td></tr>`;

      const url = `https://api.torn.com/v2/faction/${factionId.trim()}/members`;

      try {
        const response = await fetch(url + `?key=${apiKey.trim()}&stripTags=true`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          let errMsg = `HTTP ${response.status}`;
          try { const errData = await response.json(); if (errData?.error) errMsg = errData.error; } catch (_) {}
          setStatus(`⚠️ API error: ${errMsg}`, true);
          tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(errMsg)}</td></tr>`;
          return null;
        }

        const data = await response.json();
        if (data?.error) {
          setStatus(`⚠️ ${data.error}`, true);
          tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(data.error)}</td></tr>`;
          return null;
        }

        let members = data?.members || [];
        if (!Array.isArray(members)) {
          if (members && typeof members === 'object') {
            members = Object.values(members).filter(v => v && typeof v === 'object');
          } else members = [];
        }
        return members;
      } catch (err) {
        setStatus(`❌ Network error: ${err.message || 'unknown'}`, true);
        tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-wifi-slash"></i> Could not connect</td></tr>`;
        return null;
      } finally {
        spinner.style.display = 'none';
      }
    }

    // ----- fetch single user (by ID) -----
    async function fetchUser(apiKey, userId) {
      if (!apiKey.trim()) { setStatus('❌ API key required.', true); return null; }
      if (!userId.trim()) { setStatus('❌ User ID required.', true); return null; }

      setStatus('⏳ Fetching user...', false, true);
      tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-spinner fa-pulse"></i> loading...</td></tr>`;

      // Use the v2/user endpoint
      const url = `https://api.torn.com/v2/user/${userId.trim()}`;

      try {
        const response = await fetch(url + `?key=${apiKey.trim()}&stripTags=true&selections=profile,basic`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          let errMsg = `HTTP ${response.status}`;
          try { const errData = await response.json(); if (errData?.error) errMsg = errData.error; } catch (_) {}
          setStatus(`⚠️ API error: ${errMsg}`, true);
          tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(errMsg)}</td></tr>`;
          return null;
        }

        const data = await response.json();
        if (data?.error) {
          setStatus(`⚠️ ${data.error}`, true);
          tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(data.error)}</td></tr>`;
          return null;
        }

        // The v2/user endpoint returns the user object directly
        if (data && data.id) {
          // Check if the user is revivable (in hospital)
          // The API might not have is_revivable directly, we check status
          let isRevivable = false;
          if (data.status && data.status.state === 'Hospital') {
            isRevivable = true;
          }
          // Also check if the user is in hospital via the "hospital" field
          if (data.hospital && data.hospital !== null && data.hospital !== 0) {
            isRevivable = true;
          }
          // Some versions have is_revivable
          if (data.is_revivable !== undefined) {
            isRevivable = data.is_revivable === true;
          }

          const user = {
            id: data.id,
            name: data.name || 'Unnamed',
            is_revivable: isRevivable
          };
          return [user];
        } else {
          setStatus('⚠️ User not found or invalid response.', true);
          tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-user-slash"></i> User not found</td></tr>`;
          return null;
        }
      } catch (err) {
        setStatus(`❌ Network error: ${err.message || 'unknown'}`, true);
        tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-wifi-slash"></i> Could not connect</td></tr>`;
        return null;
      } finally {
        spinner.style.display = 'none';
      }
    }

    // ----- main action: decide faction or user -----
    async function handleFetch() {
      const apiKey = apiInput.value;
      const factionId = factionInput.value;
      const userId = userSearchInput.value;

      if (!apiKey.trim()) {
        setStatus('❌ Please enter your API key.', true);
        return;
      }

      // if user ID is provided, use that (priority)
      if (userId.trim()) {
        const result = await fetchUser(apiKey, userId);
        if (result) {
          renderMembers(result);
          setStatus(`✅ ${result.length} user(s) loaded`, false);
        }
        return;
      }

      // else fallback to faction
      if (!factionId.trim()) {
        setStatus('❌ Please provide either a User ID or a Faction ID.', true);
        return;
      }

      const result = await fetchFaction(apiKey, factionId);
      if (result) {
        renderMembers(result);
        setStatus(`✅ ${result.length} member(s) loaded`, false);
      }
    }

    function clearAll() {
      userSearchInput.value = '';
      factionInput.value = '';
      tableBody.innerHTML = `<tr class="empty-row"><td colspan="2"><i class="fas fa-users-slash"></i> No data</td></tr>`;
      setStatus('🔍 Enter API key, then faction or user ID', false);
    }

    // ----- event listeners -----
    fetchBtn.addEventListener('click', function(e) {
      e.preventDefault();
      handleFetch();
    });

    searchUserBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (userSearchInput.value.trim()) {
        handleFetch(); // will prioritize user ID
      } else {
        setStatus('ℹ️ Enter a User ID to lookup.', false);
      }
    });

    clearSearchBtn.addEventListener('click', function(e) {
      e.preventDefault();
      clearAll();
    });

    // enter key support
    userSearchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchUserBtn.click();
      }
    });

    function handleEnter(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        fetchBtn.click();
      }
    }
    apiInput.addEventListener('keydown', handleEnter);
    factionInput.addEventListener('keydown', handleEnter);

    // initial status
    setStatus('🔍 Enter API key, then faction or user ID', false);
    if (apiInput.value) {
      setStatus('⚡ Enter faction ID or user ID and press "Check Revive" or "Lookup User"', false);
    }
  })();
</script>

</body>
</html>
